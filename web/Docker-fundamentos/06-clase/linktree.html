<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sus Villegas | Tarjeta de Presentación</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@900&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --morado-principal: #4a148c;
            --rosa-neon: #ff00bd;
            --rosa-claro: #fce4ec;
            --blanco: #ffffff;
            --gris-oscuro: #1a1a1a;
            --fuente-titulos: "Lexend", sans-serif;
            --fuente-texto: "Roboto Condensed", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--fuente-texto);
            background: linear-gradient(135deg, var(--morado-principal) 0%, var(--gris-oscuro) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--blanco);
        }

        .card {
            background: rgba(26, 26, 26, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid var(--rosa-neon);
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(255, 0, 189, 0.2);
            animation: fadeIn 1s ease-out;
        }

        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            background: var(--rosa-claro);
            border-radius: 50%;
            border: 4px solid var(--rosa-neon);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            box-shadow: 0 0 15px var(--rosa-neon);
        }

        .badge {
            position: absolute;
            bottom: 0;
            right: 0;
            background: var(--morado-principal);
            border: 2px solid var(--rosa-neon);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
        }

        h1 {
            font-family: var(--fuente-titulos);
            font-size: 2rem;
            letter-spacing: -0.03em;
            margin-bottom: 5px;
            color: var(--blanco);
        }

        .subtitle {
            font-size: 1rem;
            color: #f48fb1;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .bio {
            font-size: 0.95rem;
            color: #ccc;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-btn {
            background: transparent;
            color: var(--blanco);
            border: 2px solid var(--blanco);
            padding: 14px 20px;
            border-radius: 50px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .link-btn:hover {
            background: var(--blanco);
            color: var(--morado-principal);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.2);
        }

        .link-btn--featured {
            background: var(--rosa-neon);
            border-color: var(--rosa-neon);
        }

        .link-btn--featured:hover {
            background: var(--blanco);
            border-color: var(--blanco);
            color: var(--rosa-neon);
            box-shadow: 0 10px 20px rgba(255, 0, 189, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar-container">
            <div class="avatar">🐈</div>
            <div class="badge">⚜️</div>
        </div>

        <h1>Sus Villegas</h1>
        <div class="subtitle">Ingeniería en Sistemas</div>
        <p class="bio">Programadora Full Stack enfocada en IoT, desarrollo móvil y despliegue de infraestructura con contenedores.</p>

        <div class="links-container">
            <a href="https://github.com/SusVZ004/26AProgWebSusanaVillegas" target="_blank" class="link-btn link-btn--featured">
                🌐 Mi Portafolio Web
            </a>
            
            <a href="https://github.com/SusVZ004" target="_blank" class="link-btn">
                💻 Perfil de GitHub
            </a>

        </div>
    </div>

</body>
</html>
