<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Solicitudes - Sistema Scout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen font-sans antialiased text-slate-800">

    <header class="bg-violet-900 text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid font-bold text-2xl text-amber-400">⚜️</i>
                <span class="text-xl font-bold tracking-wide">Mundo Mejor Sistema</span>
            </div>
            <span class="text-xs bg-violet-800 px-3 py-1 rounded-full text-violet-200 font-medium">Módulo Solicitudes</span>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-10">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 h-fit">
                <div class="flex items-center space-x-2 mb-6">
                    <i class="fa-solid fa-file-signature text-violet-600 text-lg"></i>
                    <h2 class="text-lg font-bold text-slate-900">Vincular Solicitud</h2>
                </div>
                
                <form id="form-solicitud" class="space-y-5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">ID del Postulante</label>
                        <input type="number" id="idPostulante" required 
                            class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-violet-500 focus:bg-white transition-all text-sm" 
                            placeholder="Ej. 1">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">ID del Proyecto</label>
                        <input type="number" id="idProyecto" required 
                            class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-violet-500 focus:bg-white transition-all text-sm" 
                            placeholder="Ej. 4">
                    </div>

                    <button type="submit" 
                        class="w-full bg-violet-600 hover:bg-violet-700 text-white font-medium py-2.5 px-4 rounded-xl shadow-sm shadow-violet-200 hover:shadow-none transition-all flex items-center justify-center space-x-2 text-sm mt-2">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                        <span>Enviar Solicitud</span>
                    </button>
                </form>
            </div>

            <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="p-6 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-clipboard-list text-slate-500"></i>
                        <h2 class="text-lg font-bold text-slate-900">Historial de Solicitudes</h2>
                    </div>
                </div>

                <ul id="lista-solicitudes" class="p-6 space-y-3">
                    </ul>
            </div>

        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
