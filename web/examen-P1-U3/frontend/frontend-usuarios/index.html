<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Miembros - Sistema Scout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen font-sans antialiased text-slate-800">

    <header class="bg-emerald-800 text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid font-bold text-2xl text-amber-400">⚜️</i>
                <span class="text-xl font-bold tracking-wide">Mundo Mejor Sistema</span>
            </div>
            <span class="text-xs bg-emerald-700 px-3 py-1 rounded-full text-emerald-200 font-medium">Módulo Postulantes</span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-10">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <div class="md:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 h-fit">
                <div class="flex items-center space-x-2 mb-6">
                    <i class="fa-solid fa-user-plus text-emerald-600 text-lg"></i>
                    <h2 class="text-lg font-bold text-slate-900">Nuevo Postulante</h2>
                </div>
                
                <form id="form-usuario" class="space-y-5">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Nombre Completo</label>
                        <input type="text" id="nombre" required 
                            class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all text-sm" 
                            placeholder="Ej. Susana Villegas">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Sección Scout</label>
                        <select id="seccion" required 
                            class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all text-sm appearance-none cursor-pointer">
                            <option value="Manada de Lobatos">Manada de Lobatos</option>
                            <option value="Tropa Scout">Tropa Scout</option>
                            <option value="Comunidad de Caminantes">Comunidad de Caminantes</option>
                            <option value="Clan de Rovers">Clan de Rovers</option>
                        </select>
                    </div>

                    <button type="submit" 
                        class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 px-4 rounded-xl shadow-sm shadow-emerald-200 hover:shadow-none transition-all flex items-center justify-center space-x-2 text-sm mt-2">
                        <i class="fa-solid fa-check text-xs"></i>
                        <span>Registrar Miembro</span>
                    </button>
                </form>
            </div>

            <div class="md:col-span-2 bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="p-6 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-users text-slate-500"></i>
                        <h2 class="text-lg font-bold text-slate-900">Scouts Inscritos</h2>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <ul id="lista-usuarios" class="p-6 space-y-3"></ul>
                </div>
            </div>

        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
